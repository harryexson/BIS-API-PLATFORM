openapi: 3.1.0
info:
  title: BIS API Platform
  version: 1.1.0
  summary: Unified payments, messaging, and provider orchestration API.
  description: |
    The public, API-key-authenticated surface of the BIS API Gateway
    (`services/api-gateway/src/app.ts`): payments, refunds, messaging,
    transaction status, provider discovery, hosted checkout, inbound provider
    webhooks and health probes.

    This document describes the gateway exactly as it runs. Every path below
    is a real route (paths are absolute — note that `/refunds`, `/health` and
    `/ready` are NOT under `/v1`), and the route table is checked against this
    file by `packages/simulation/src/api-contract-validation.simulation.test.ts`.
    Admin (`/api/dashboard/*`), developer-portal (`/v1/portal/*`), account
    (`/v1/api/auth/*`, `/v1/api/billing/*`) and the remaining tenant routes
    (consent, messaging profiles, keyword commands, webhook endpoints,
    suppliers, `/v1/api/gateway/other`) exist but are not documented here.

    ## Amounts — MAJOR currency units
    Every `amount` (request and response) is a decimal number in **major
    currency units** with at most 2 decimal places: `49.99` with
    `currency: USD` charges **USD 49.99**. It is NOT a count of minor units
    (cents) — sending `4999` charges USD 4,999.00. The gateway converts to
    each provider's own wire format itself (e.g. Stripe receives `4999`
    cents for `49.99`). Amounts with more than 2 decimal places, zero,
    negative, non-numeric or above 1,000,000,000 are rejected with `400`.

    ## Authentication and tenant context
    Every `/v1/api/gateway/*` route and `/refunds` requires:
    - an application API key — `Authorization: Bearer <key>` (or `x-api-key: <key>`).
      The application is taken from the key; an `appId` in the body is ignored.
      A deployment accepts only keys of its own tier (production: live keys only).
    - `x-tenant-id` — the tenant the request acts for. It must be a tenant
      actively linked to the key's application; otherwise `403`. Missing: `400`.
    - optional `x-supplier-id` — a supplier owned by that tenant (else `403`).

    Tenant/supplier/application identity is never read from the request body
    (`tenantId`, `tenant_id`, `supplierId`, `applicationId`, ... are stripped).

    ## Field naming
    Request and response fields are camelCase (`paymentMethod`,
    `providerOverride`, `phoneNumber`), except `/refunds`, whose request uses
    `payment_id` / `idempotency_key` and whose response is snake_case.

    ## Errors
    Field-validation failures are always
    `400 {"error": {"code": "invalid_request", "field": "<field>", "message": "..."}}`.
    Other errors use either `{"error": {"code": "...", "message": "..."}}` or a
    plain `{"error": "<message>"}` (plus route-specific fields) — see each
    operation's responses.

    ## Tracing
    Every response carries `X-Request-Id`. An optional `X-Correlation-Id`
    request header is recorded in the gateway's logs (it is not echoed back).
  contact:
    name: Platform Team
    email: platform@company.com
  license:
    name: Proprietary

servers:
  - url: https://api.company.com
    description: Production (live API keys). Placeholder host — use your deployment's gateway origin.
  - url: https://sandbox.api.company.com
    description: Sandbox (test API keys). Placeholder host.

tags:
  - name: Payments
  - name: Refunds
  - name: Messaging
  - name: Transactions
  - name: Providers
  - name: Checkout
  - name: Webhooks
  - name: Health

security:
  - bearerAuth: []
  - apiKeyHeader: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        `200` only when the database is reachable and provider configuration is
        loaded with every provider's secrets readable; otherwise `503` with the
        failing dependency named.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready (a dependency is degraded/unreachable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /v1/api/gateway/payment:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Records the payment (a platform transaction row is created before any
        provider is called), routes it to a capable provider and returns the
        resulting transaction event.

        - `200` — the provider returned an outcome: `status` is `success`,
          `failed` (declined) or `pending` (e.g. mobile money — final state
          arrives via provider webhook).
        - `202` — `status: unknown`: the provider's outcome is not known (e.g.
          timeout). It may have been charged; it is never retried on another
          provider and is reconciled with the provider before anything else.

        **Idempotency:** send `Idempotency-Key` (or body `idempotency_key`).
        The same key with the same body replays the original response; with a
        different body it is a `409`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
            examples:
              card:
                summary: Card payment of USD 49.99
                value:
                  amount: 49.99
                  currency: USD
                  paymentMethod: card
                  paymentToken: pm_card_visa
                  metadata:
                    orderId: ORD-1001
              mobile_money:
                summary: Mobile money payment of MWK 5,000
                value:
                  amount: 5000
                  currency: MWK
                  paymentMethod: mobile_money
                  phoneNumber: "+265888000111"
      responses:
        '200':
          description: The provider's outcome.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionEvent' }
        '202':
          description: Outcome unknown (`status` is `unknown`) — being reconciled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: The `providerOverride` names a provider that cannot take this payment. Nothing was sent to any provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingFailure' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: |
            No capable provider is available (nothing was sent to any provider),
            or the payment record could not be created (the payment was NOT attempted).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RoutingFailure'
                  - $ref: '#/components/schemas/ErrorEnvelope'

  /v1/api/gateway/transaction/{id}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a payment or message's status
      description: |
        Status of a transaction event this application AND tenant created
        (the `id` returned by the payment or messaging route). Another tenant's
        id is the same `404` as an unknown one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: The transaction status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found (or not this tenant's).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a successful payment
      description: |
        Refunds (fully, or partially with `amount`) a successful payment this
        application and tenant made. `payment_id` is the payment's `id` from
        the payment response. Note: this route is NOT under `/v1`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
            examples:
              full:
                summary: Full refund
                value:
                  payment_id: pi_3MtwBwLkdIwHu7ix28a3tqPa
                  reason: customer_requested
              partial:
                summary: Partial refund of USD 20.00
                value:
                  payment_id: pi_3MtwBwLkdIwHu7ix28a3tqPa
                  amount: 20.00
                  currency: USD
      responses:
        '201':
          description: Refund submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Payment not found (or not this tenant's).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: The payment has no successful capture, or `amount` exceeds the captured amount.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Provider unavailable, refund failed, or the payment record could not be verified (nothing was refunded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/api/gateway/messaging:
    post:
      tags: [Messaging]
      operationId: sendMessage
      summary: Send a message (SMS, WhatsApp or email)
      description: |
        Routes the message to a provider of the requested channel. When
        `channel` is omitted it is inferred: an email address → `email`; a
        `whatsapp:` recipient, a body containing `wa:` or longer than 300
        characters → `whatsapp`; otherwise `sms`. The channel is never switched
        unless `channelPolicy.allowChannelSwitch` is `true`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageRequest' }
            examples:
              sms:
                summary: SMS
                value:
                  channel: sms
                  recipient: "+265888000111"
                  content: Your appointment is confirmed.
              email:
                summary: Email
                value:
                  channel: email
                  recipient: jane@example.com
                  content: Thank you for your order.
      responses:
        '200':
          description: The provider's outcome, including the channel decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Tenant/supplier not authorised, or the recipient has opted out of messaging on this channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: 'No provider of the requested channel could send it (`code` is `channel_unavailable`), or routing failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /v1/api/gateway/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: Discover providers and their capabilities
      description: |
        Without `category`: every provider's configuration view. With
        `category`: the available providers of that category, optionally
        narrowed to one `capability` and one `currency`. Secrets are never returned.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: category
          in: query
          schema: { type: string, enum: [payment, messaging, other] }
        - name: capability
          in: query
          description: e.g. `card`, `mobile_money`, `sms`. Only used with `category`.
          schema: { type: string }
        - name: currency
          in: query
          description: ISO 4217 code. Only used with `category`.
          schema: { type: string }
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers, count]
                properties:
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/Provider' }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/api/gateway/checkout-sessions:
    post:
      tags: [Checkout]
      operationId: createCheckoutSession
      summary: Create a hosted checkout session
      description: |
        Creates a single-use session (valid 30 minutes) for exactly this
        amount and currency. Send the shopper to `checkoutUrl`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutSessionRequest' }
            example:
              amount: 25.00
              currency: USD
              successUrl: https://shop.example.com/thanks
              cancelUrl: https://shop.example.com/cart
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/checkout/sessions/{token}:
    get:
      tags: [Checkout]
      operationId: getCheckoutSession
      summary: Read a checkout session (public — the token is the credential)
      security: []
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/checkout/sessions/{token}/pay:
    post:
      tags: [Checkout]
      operationId: payCheckoutSession
      summary: Pay a checkout session (public — the token is the credential)
      description: |
        Charges the session's own amount and currency (they cannot be changed
        here). One payment per session.
      security: []
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutPayRequest' }
      responses:
        '200':
          description: The payment outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success, failed, pending, unknown] }
                  id: { type: string }
                  paymentTransactionId: { type: string }
                  successUrl: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: Session already completed/expired, or a payment for it is already in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Payment failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /v1/api/webhooks/{provider}:
    post:
      tags: [Webhooks]
      operationId: receiveProviderWebhook
      summary: Inbound provider webhook
      description: |
        Called by providers (or a relay), not by API consumers. The body must be
        a JSON object with a non-empty `id` (the provider event id; duplicates
        are acknowledged without re-processing). Authenticated ONLY by the
        platform signature header `X-Webhook-Signature`: hex HMAC-SHA256 of the
        exact raw body with the gateway's `WEBHOOK_HMAC_SECRET`. Provider-native
        signature headers (Stripe-Signature, verif-hash, ...) are not checked by
        this route. `200` is returned only once the event is durably recorded
        and queued.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: A registered provider id (e.g. `stripe`, `pawapay`, `infobip`).
          schema: { type: string }
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string, description: 'hex HMAC-SHA256(raw body)' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, maxLength: 255 }
              additionalProperties: true
      responses:
        '200':
          description: Recorded and queued (or an already-recorded duplicate).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
                  webhookEventId: { type: string }
        '400':
          description: Body is not a JSON object with an `id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '401':
          description: Missing/invalid signature, or unknown provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '503':
          description: Not recorded (verification not configured, storage/queue failure) — retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "The application's API key, sent as `Authorization: Bearer <key>`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Alternative to the Bearer header.

  headers:
    RequestId:
      description: Unique id of this request (also in the gateway's logs).
      schema: { type: string, format: uuid }

  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      description: |
        The tenant this request acts for. Must be actively linked to the API
        key's application (`403` otherwise; `400` when missing).
      schema: { type: string, maxLength: 255 }
    SupplierId:
      name: x-supplier-id
      in: header
      required: false
      description: Optional supplier scope; must be owned by the tenant (`403` otherwise).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key making the request safe to retry. Same key + same
        body → the original response; same key + different body → `409`.
        Alternatively send `idempotency_key` in the body.
      schema: { type: string, maxLength: 255 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Recorded in the gateway's logs for this request.
      schema: { type: string }
    CheckoutToken:
      name: token
      in: path
      required: true
      description: The session `token` returned when the session was created.
      schema: { type: string }

  responses:
    BadRequest:
      description: A request field is missing or invalid (or `x-tenant-id` is missing).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/SimpleError'
          example:
            error:
              code: invalid_request
              field: amount
              message: amount must be a positive number in major currency units (e.g. 49.99 for USD 49.99) with at most 2 decimal places
    Unauthorized:
      description: Missing, invalid or wrong-tier API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SimpleError' }
          example:
            error: API key required
    Forbidden:
      description: The tenant is not linked to this application, or the supplier is not owned by the tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SimpleError' }
          example:
            error: 'Access denied: tenant not linked to this application'
    IdempotencyConflict:
      description: |
        `idempotency_conflict` — the key was already used with a different body
        (`error.resource` is the original result); or `idempotency_in_progress`
        — a request with this key is still running (with `Retry-After`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SimpleError' }
          example:
            error: Rate limit exceeded

  schemas:
    MoneyAmount:
      type: number
      exclusiveMinimum: 0
      maximum: 1000000000
      multipleOf: 0.01
      description: |
        An amount in MAJOR currency units — 49.99 means USD 49.99, not cents —
        with at most 2 decimal places. A plain decimal string ("49.99") is
        also accepted on requests.
      example: 49.99

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, field, message]
          properties:
            code: { type: string, enum: [invalid_request] }
            field: { type: string, description: 'The offending field, e.g. amount, currency, recipient.' }
            message: { type: string }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                e.g. invalid_request, not_found, invalid_operation,
                idempotency_conflict, idempotency_in_progress,
                payment_record_unavailable, provider_unavailable, refund_failed.
            message: { type: string }
            resource: { description: 'For idempotency_conflict: the original result.' }

    SimpleError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        detail: { type: string }
        id: { type: string }
      additionalProperties: true

    RoutingFailure:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Payment routing failed }
        id: { type: string }
        paymentTransactionId: { type: string }
        code: { type: string, description: 'Present for a specific reason, e.g. no capable provider.' }
        detail: { type: string }

    PaymentRequest:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          default: USD
          description: ISO 4217 code.
        paymentMethod:
          type: string
          default: card
          description: e.g. `card`, `mobile_money`, `bank_transfer`, `wallet` — the capability routing requires.
        paymentToken:
          type: string
          maxLength: 1024
          description: |
            Provider-issued token/nonce for the payment instrument (e.g. a Stripe
            PaymentMethod id). Never raw card data. Card providers need it to
            charge for real.
        phoneNumber:
          type: string
          description: Payer's phone number (mobile money).
        country:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: ISO 3166-1 alpha-2; restricts routing to providers serving it.
        providerOverride:
          type: string
          description: Force a specific provider id (it must be capable of the payment, else `422`).
        metadata:
          type: object
          additionalProperties: true
          description: JSON object, at most 16 KiB serialized.
        idempotency_key:
          type: string
          maxLength: 255
          description: Alternative to the `Idempotency-Key` header.

    RefundRequest:
      type: object
      required: [payment_id]
      properties:
        payment_id:
          type: string
          description: The payment's `id` from the payment response.
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          type: string
          description: Defaults to the payment's currency.
        reason: { type: string }
        metadata: { type: object, additionalProperties: true }
        idempotency_key: { type: string, maxLength: 255 }

    Refund:
      type: object
      required: [id, object, payment_id, status, created_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [refund] }
        payment_id: { type: string }
        status: { type: string, enum: [success, failed, pending] }
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency: { type: string }
        reason: { type: string }
        provider_refund_id: { type: string }
        created_at: { type: string, format: date-time }

    MessageRequest:
      type: object
      required: [recipient, content]
      properties:
        recipient:
          type: string
          description: |
            A phone number (optional leading `+`, 3-15 digits; spaces, dots,
            dashes and parentheses allowed; optional `whatsapp:`/`sms:`/`tel:`
            scheme) or an email address (max 254 characters).
          example: "+265888000111"
        content:
          type: string
          minLength: 1
          maxLength: 16384
          description: The message body; must not be blank.
        channel:
          type: string
          enum: [sms, whatsapp, email]
          description: Requested channel. Omitted → inferred (see the operation description).
        channelPolicy:
          type: object
          description: Opt-in channel switching when no provider of the requested channel can send.
          properties:
            allowChannelSwitch: { type: boolean, default: false }
            fallbackChannels:
              type: array
              items: { type: string, enum: [sms, whatsapp, email] }
            fallbackRecipients:
              type: object
              description: 'Recipient address per fallback channel, e.g. `{"email": "jane@example.com"}`.'
              additionalProperties: { type: string }
        providerOverride:
          type: string
          description: Force a specific provider id.

    TransactionEvent:
      type: object
      description: The outcome of a payment or message, as returned by the gateway.
      required: [id, timestamp, appId, category, providerId, status, latency, cost, decisionReason]
      properties:
        id:
          type: string
          description: The provider's transaction/message id (e.g. a Stripe PaymentIntent id) — use it for status lookups and refunds.
        timestamp: { type: string, format: date-time }
        appId: { type: string, description: 'The application (from the API key).' }
        tenantId: { type: string }
        supplierId: { type: string }
        category: { type: string, enum: [payment, messaging, other] }
        providerId: { type: string, example: stripe }
        status: { type: string, enum: [success, failed, pending, unknown] }
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency: { type: string }
        latency: { type: number, description: Milliseconds. }
        cost: { type: number, description: 'Provider fee estimate, in the payment currency (major units).' }
        decisionReason: { type: string }
        error: { type: string }
        paymentTransactionId: { type: string, description: "The platform's own payment record id." }
        fraudRiskLevel: { type: string }
        fraudRiskScore: { type: number }
        requestedChannel: { type: string, enum: [sms, whatsapp, email] }
        requestedChannelSource: { type: string, enum: [explicit, inferred] }
        selectedChannel: { type: [string, 'null'], enum: [sms, whatsapp, email, null] }
        fallbackReason: { type: [string, 'null'] }
        payload: { description: The request as routed to the provider. }
        response: { description: "The provider's raw response." }

    TransactionStatus:
      type: object
      required: [id, status, providerId, category, cost, latency, timestamp]
      properties:
        id: { type: string }
        status: { type: string, enum: [success, failed, pending, unknown] }
        providerId: { type: string }
        category: { type: string, enum: [payment, messaging, other] }
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency: { type: string }
        messageType: { type: string }
        cost: { type: number }
        latency: { type: number }
        timestamp: { type: string, format: date-time }
        providerTransactionId: { type: string }
        error: { type: string }

    Provider:
      type: object
      required: [id, name, category, status]
      properties:
        id: { type: string, example: pawapay }
        name: { type: string, example: PawaPay }
        category: { type: string, enum: [payment, messaging, other] }
        status: { type: string, enum: [online, offline, maintenance] }
        weight: { type: number, description: Routing priority (0-100). }
        environment: { type: string, enum: [test, live] }
        countries: { type: array, items: { type: string }, example: [MW, ZM] }
        currencies: { type: array, items: { type: string }, example: [MWK, ZMW] }
        capabilities: { type: array, items: { type: string }, example: [mobile_money] }
        errorRate: { type: number }
        transactionFeePercent: { type: number }
        transactionFeeFlat: { type: number }
        messageCost: { type: number }
      additionalProperties: true

    CheckoutSessionRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        successUrl: { type: string }
        cancelUrl: { type: string }
        metadata: { type: object, additionalProperties: true }

    CheckoutSessionCreated:
      type: object
      required: [id, token, checkoutUrl, expiresAt]
      properties:
        id: { type: string }
        token: { type: string }
        checkoutUrl: { type: string }
        expiresAt: { type: string, format: date-time }

    CheckoutSession:
      type: object
      required: [id, status, amount, currency]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, completed, expired] }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { type: string }
        applicationName: { type: string }

    CheckoutPayRequest:
      type: object
      properties:
        paymentMethod: { type: string, default: card }
        paymentToken: { type: string, maxLength: 1024 }
        phoneNumber: { type: string }
        country: { type: string, pattern: '^[A-Za-z]{2}$' }
        metadata: { type: object, additionalProperties: true }

    Health:
      type: object
      properties:
        status: { type: string, enum: [healthy] }
        service: { type: string, example: api-gateway }
        timestamp: { type: string, format: date-time }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ready, degraded] }
        service: { type: string }
        dependencies:
          type: object
          properties:
            database: { type: string }
            rateLimiter: { type: string, enum: [redis, in-memory] }
            providers: { type: string, enum: [ready, degraded, not-loaded] }
        timestamp: { type: string, format: date-time }
