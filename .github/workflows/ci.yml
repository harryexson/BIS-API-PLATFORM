name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (per ADR-002 runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build all workspaces
        run: npm run build:all